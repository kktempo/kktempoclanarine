function ucitajGrupu(){

let grupa=document.getElementById("grupa").value;
let tabela=document.getElementById("tabela");

tabela.innerHTML="";

grupe[grupa].forEach(ime=>{

tabela.innerHTML+=`

<td>

<button
class="status-btn prisutan"
onclick="izaberiStatus(this,'${ime}','Prisutan')">

</button>

let statusi={};

function izaberiStatus(dugme, ime, status){

    statusi[ime]=status;

    let red=dugme.parentElement.parentElement;

    red.querySelectorAll(".status-btn").forEach(btn=>{
        btn.classList.remove("active");
    });

    dugme.classList.add("active");

}

document.getElementById("datum").value =
new Date().toISOString().split("T")[0];

document.getElementById("datum")
.addEventListener("change", ucitajSacuvanuEvidenciju);

function sacuvaj(){

    let grupa = document.getElementById("grupa").value;
    let datum = document.getElementById("datum").value;

    let evidencija = {};

    grupe[grupa].forEach(ime => {

        evidencija[ime] = statusi[ime] || "Nije označeno";

    });

    // Čuvanje evidencije
    localStorage.setItem(
        "evidencija_" + grupa + "_" + datum,
        JSON.stringify(evidencija)
    );

    // Dodavanje u arhivu
    let lista = JSON.parse(localStorage.getItem("listaEvidencija")) || [];

    if(!lista.find(x => x.grupa === grupa && x.datum === datum)){

        lista.push({
            datum: datum,
            grupa: grupa
        });

        localStorage.setItem(
            "listaEvidencija",
            JSON.stringify(lista)
        );

    }

    alert("Evidencija sačuvana.");

proveriTriUzastopnaOdsustva();

}

function ucitajSacuvanuEvidenciju(){

    let grupa = document.getElementById("grupa").value;
    let datum = document.getElementById("datum").value;

    if(!datum) return;


    let sacuvano = localStorage.getItem(
        "evidencija_" + grupa + "_" + datum
    );


    if(!sacuvano){
        statusi = {};
        return;
    }


    statusi = JSON.parse(sacuvano);


    let redovi = document.querySelectorAll("#tabela tr");


    redovi.forEach(red=>{

        let ime = red.cells[0].innerText;


        let status = statusi[ime];


        red.querySelectorAll(".status-btn")
        .forEach(btn=>{

            btn.classList.remove("active");

        });


        if(status==="Prisutan"){

            red.querySelector(".prisutan")
            .classList.add("active");

        }


        if(status==="Nije prisutan"){

            red.querySelector(".odsutan")
            .classList.add("active");

        }


    });

}

async function izveziPDF(){

const { jsPDF } = window.jspdf;

const pdf = new jsPDF();

let grupa=document.getElementById("grupa").value;
let datum=document.getElementById("datum").value;

if(!grupa || !datum){
    alert("Izaberite grupu i datum!");
    return;
}


// NASLOV

pdf.setFontSize(18);
pdf.text("KK TEMPO BRATUNAC",105,15,{align:"center"});

pdf.setFontSize(15);
pdf.text("EVIDENCIJA TRENINGA",105,25,{align:"center"});


pdf.setFontSize(12);
pdf.text("Datum: "+datum,20,40);
let nazivGrupe = {
    mini: "GRUPA 1",
    mladji: "GRUPA 2",
    kadeti: "GRUPA 3"
};


pdf.text("Grupa: "+(nazivGrupe[grupa] || grupa.toUpperCase()),20,48);


// TABELA

let y=65;


function zaglavlje(){

pdf.setFontSize(12);

pdf.rect(15,y-7,180,10);

pdf.text("R.br",20,y);
pdf.text("Ime i prezime",45,y);
pdf.text("Status",150,y);

y+=10;

}


zaglavlje();


let prisutni=0;
let odsutni=0;


grupe[grupa].forEach((ime,index)=>{


let status=statusi[ime] || "Nije označeno";


if(status==="Prisutan") prisutni++;
if(status==="Nije prisutan") odsutni++;


pdf.rect(15,y-7,180,10);

pdf.text(String(index+1),20,y);

pdf.text(ime,45,y);

pdf.text(status,150,y);


y+=10;



// nova strana

if(y>270){

pdf.addPage();

y=20;

zaglavlje();

}


});


// REZULTATI

y+=10;

pdf.setFontSize(13);

pdf.text("STATISTIKA",20,y);

y+=10;

pdf.setFontSize(12);

pdf.text("Prisutno: "+prisutni,20,y);

pdf.text("Odsutno: "+odsutni,20,y+8);

pdf.text("Ukupno clanova: "+grupe[grupa].length,20,y+16);



pdf.save(
"Evidencija_"+grupa+"_"+datum+".pdf"
);


}

) || {};


function ucitajIgraceZaRoditelje(){

    let select = document.getElementById("izborRoditelja");

    if(!select) return;

    select.innerHTML = `
        <option value="">-- IZABERITE IGRAČA --</option>
    `;

    for(let grupa in grupe){

        let nazivGrupe =
            grupa === "mini"
            ? "GRUPA 1"
            : grupa === "mladji"
            ? "GRUPA 2"
            : "GRUPA 3";

        let optgroup = document.createElement("optgroup");

        optgroup.label = nazivGrupe;

        grupe[grupa].forEach(ime => {

            let option = document.createElement("option");

            option.value = ime;
            option.textContent = ime;

            optgroup.appendChild(option);

        });

        select.appendChild(optgroup);

    }

}


function ucitajPodatkeRoditelja(){

    let imeIgraca =
        document.getElementById("izborRoditelja").value;

    let imeRoditelja =
        document.getElementById("imeRoditelja");

    let telefon =
        document.getElementById("telefonRoditelja");

    if(!imeIgraca){

        imeRoditelja.value = "";
        telefon.value = "";

        return;

    }

    let podaci = roditelji[imeIgraca];

    if(podaci){

        imeRoditelja.value = podaci.imeRoditelja || "";
        telefon.value = podaci.telefon || "";

    }else{

        imeRoditelja.value = "";
        telefon.value = "";

    }

}


function sacuvajRoditelja(){

    let imeIgraca =
        document.getElementById("izborRoditelja").value;

    let imeRoditelja =
        document.getElementById("imeRoditelja").value.trim();

    let telefon =
        document.getElementById("telefonRoditelja").value.trim();

    let poruka =
        document.getElementById("porukaRoditelj");


    if(!imeIgraca){

        alert("Izaberite igrača.");

        return;

    }


    if(!imeRoditelja){

        alert("Unesite ime roditelja.");

        return;

    }


    if(!telefon){

        alert("Unesite broj telefona roditelja.");

        return;

    }


    roditelji[imeIgraca] = {

        imeRoditelja: imeRoditelja,

        telefon: telefon

    };


    localStorage.setItem(
        "podaciRoditelja",
        JSON.stringify(roditelji)
    );


    poruka.innerHTML = `

    `;


    /*

        dobije Viber dugme ako postoji
    */

    proveriTriUzastopnaOdsustva();

}

function pretraziIgraca(){

    let unos = document
        .getElementById("pretragaIgraca")
        .value
        .trim()
        .toLowerCase();

    let rezultat = document.getElementById("rezultatPretrage");

    if(unos.length < 2){

        rezultat.innerHTML = "";
        return;

    }

    let pronadjeni = [];

    /*
        Prolazimo kroz sve tri grupe
    */

    for(let grupa in grupe){

        grupe[grupa].forEach(ime => {

            if(ime.toLowerCase().includes(unos)){

                if(!pronadjeni.some(x => x.ime === ime)){

                    pronadjeni.push({
                        ime: ime,
                        grupa: grupa
                    });

                }

            }

        });

    }

    if(pronadjeni.length === 0){

        rezultat.innerHTML = `
            <div class="nema-rezultata">
                Nije pronađen igrač.
            </div>
        `;

        return;

    }

    let html = "";

    pronadjeni.forEach(igrac => {

        let ukupno = 0;
        let prisutan = 0;
        let odsutan = 0;

        /*
            Uzimamo sve sačuvane evidencije
        */

        let lista = JSON.parse(
            localStorage.getItem("listaEvidencija")
        ) || [];

        lista.forEach(evidencija => {

            if(evidencija.grupa !== igrac.grupa){
                return;
            }

            let kljuc =
                "evidencija_" +
                evidencija.grupa +
                "_" +
                evidencija.datum;

            let podaci =
                JSON.parse(localStorage.getItem(kljuc));

            if(!podaci) return;

            if(podaci[igrac.ime]){

                ukupno++;

                if(podaci[igrac.ime] === "Prisutan"){
                    prisutan++;
                }

                if(podaci[igrac.ime] === "Nije prisutan"){
                    odsutan++;
                }

            }

        });

        let procenat = ukupno > 0
            ? ((prisutan / ukupno) * 100).toFixed(1)
            : 0;

        html += `

        <div class="igrac-statistika">

            <h2>${igrac.ime}</h2>

           <p class="grupa">
     ${
        igrac.grupa === "mini"
        ? "GRUPA 1"
        : igrac.grupa === "mladji"
        ? "GRUPA 2"
        : "GRUPA 3"
    }
</p>

            <div class="statistika-dolazaka">

                <div class="stat-box">
                    <strong>${ukupno}</strong>
                    <span>Ukupno treninga</span>
                </div>

                <div class="stat-box prisustvo">
                    <strong>${prisutan}</strong>
                    <span>Prisutan</span>
                </div>

                <div class="stat-box odsustvo">
                    <strong>${odsutan}</strong>
                    <span>Nije prisutan</span>
                </div>

                <div class="stat-box procenat">
                    <strong>${procenat}%</strong>
                    <span>Prisustvo</span>
                </div>

            </div>

        </div>

        `;

    });

    rezultat.innerHTML = html;

}

let porukeOdsustva = [];


function proveriTriUzastopnaOdsustva(){

    let upozorenja = document.getElementById("upozorenjaPrisustvo");

    let lista = JSON.parse(
        localStorage.getItem("listaEvidencija")
    ) || [];

    upozorenja.innerHTML = "";

    porukeOdsustva = [];

    if(lista.length === 0){
        return;
    }

    let upozorenjaLista = [];


    /* PROLAZIMO KROZ SVAKU GRUPU */

    for(let grupa in grupe){

        let evidencijeGrupe = lista
            .filter(e => e.grupa === grupa)
            .sort((a,b) => {
                return new Date(b.datum) - new Date(a.datum);
            });


        /* PROVERA SVAKOG IGRAČA */

        grupe[grupa].forEach(ime => {

            let poslednjaTri = [];


            for(let evidencija of evidencijeGrupe){

                let kljuc =
                    "evidencija_" +
                    evidencija.grupa +
                    "_" +
                    evidencija.datum;

                let podaci =
                    JSON.parse(localStorage.getItem(kljuc));

                if(!podaci){
                    continue;
                }


                /* UZIMAMO SAMO EVIDENTIRANE TRENINGE */

                if(
                    podaci[ime] === "Prisutan" ||
                    podaci[ime] === "Nije prisutan"
                ){

                    poslednjaTri.push({
                        datum: evidencija.datum,
                        status: podaci[ime]
                    });

                }


                if(poslednjaTri.length === 3){
                    break;
                }

            }


            /* AKO SU SVA TRI POSLEDNJA TRENINGA ODSUSTVO */

            if(
                poslednjaTri.length === 3 &&
                poslednjaTri.every(
                    x => x.status === "Nije prisutan"
                )
            ){

                upozorenjaLista.push({
                    ime: ime,
                    grupa: grupa,
                    treninzi: poslednjaTri
                });

            }

        });

    }


    /* AKO NEMA UPOZORENJA */

    if(upozorenjaLista.length === 0){

        upozorenja.innerHTML = `
            <div class="nema-upozorenja">
                ✓ Nema igrača sa 3 uzastopna odsustva.
            </div>
        `;

        return;

    }


    /* NASLOV */

    let html = `
        <div class="upozorenja-naslov">
            ⚠️ UPOZORENJE — 3 UZASTOPNA ODSUSTVA
        </div>
    `;


    /* SVAKI IGRAČ */

    upozorenjaLista.forEach((igrac, index) => {

        let nazivGrupe =
            igrac.grupa === "mini"
            ? "GRUPA 1"
            : igrac.grupa === "mladji"
            ? "GRUPA 2"
            : "GRUPA 3";


        let roditelj = roditelji[igrac.ime];


        /* DATUMI */

        let datumi = igrac.treninzi
            .map(t => formatirajDatum(t.datum));


        /* IME RODITELJA */

        let imeRoditelja =
            roditelj && roditelj.imeRoditelja
            ? roditelj.imeRoditelja
            : "";


        /* BROJ TELEFONA */

        let broj = "";

        if(roditelj && roditelj.telefon){

            broj = roditelj.telefon
                .replace(/\s+/g, "")
                .replace(/-/g, "")
                .replace(/\(/g, "")
                .replace(/\)/g, "");


            if(broj.startsWith("06")){
                broj = "+381" + broj.substring(1);
            }


            if(broj.startsWith("381")){
                broj = "+" + broj;
            }

        }


        /* PORUKA ZA RODITELJA */

        let poruka =

            "Poštovani " +
            (imeRoditelja || "roditelji") +
            ",\n\n" +

            "obaveštavamo Vas da Vaše dete " +
            igrac.ime +
            " nije prisustvovalo poslednja tri treninga.\n\n" +

            "Datumi odsustva:\n" +

            datumi
                .map(d => "• " + d)
                .join("\n") +

            "\n\n" +

            "Molimo Vas da nas obavestite ukoliko postoji razlog odsustva, kako bismo imali informaciju o situaciji.\n\n" +

            "Hvala na razumevanju.\n\n" +

            "KK TEMPO BRATUNAC";


        /* VIBER LINK */

        let viberLink = "";

        if(broj){

            viberLink =
                "viber://chat?number=" +
                encodeURIComponent(broj) +
                "&text=" +
                encodeURIComponent(poruka);

        }


        /* ČUVAMO PORUKU ZA OVAJ RED */

        porukeOdsustva.push({
            poruka: poruka,
            viberLink: viberLink,
            dete: igrac.ime,
            roditelj: imeRoditelja
        });


        /* VIBER DUGME */

        let viberDugme = "";

        if(viberLink){

            viberDugme = `
                <a
                    href="${viberLink}"
                    class="viber-dugme"
                >
                    📱 POŠALJI VIBER
                </a>
            `;

        }else{

            viberDugme = `
                <div class="nema-telefona">
                    ⚠️ Nije unet broj telefona roditelja.
                </div>
            `;

        }


        /* HTML UPOZORENJA */

        html += `

            <div class="upozorenje-igrac">

                <strong>${igrac.ime}</strong>

                <span>${nazivGrupe}</span>

                <small>
                    Nije prisutan poslednja 3 treninga
                </small>


                <div class="datumi-odsustva">

                    ${datumi.join(" • ")}

                </div>


                ${
                    roditelj
                    ?
                    `
                    <div class="podaci-roditelja">

                        👤 ${roditelj.imeRoditelja}

                        <br>

                        📞 ${roditelj.telefon}

                    </div>
                    `
                    :
                    ""
                }


                <div>

                    <button
                        type="button"
                        class="prikazi-poruku-dugme"
                        onclick="otvoriPorukuOdsustva(${index})"
                    >
                        ✉️ PRIKAŽI PORUKU
                    </button>

                </div>


                ${viberDugme}

            </div>

        `;

    });


    upozorenja.innerHTML = html;


    /* DODAJEMO PROZOR ZA PORUKU AKO NE POSTOJI */

    if(!document.getElementById("porukaOdsustvaOverlay")){

        let overlay = document.createElement("div");

        overlay.id = "porukaOdsustvaOverlay";

        overlay.className = "poruka-overlay";

        overlay.innerHTML = `

            <div class="poruka-prozor">

                <h3>
                    ✉️ Poruka roditelju
                </h3>


                <textarea
                    id="tekstPorukeOdsustva"
                    class="poruka-tekst"
                ></textarea>


<div class="poruka-dugmad">

    <button
        type="button"
        class="posalji-viber-poruku"
        onclick="kopirajPorukuOdsustva()"
    >
        📋 KOPIRAJ PORUKU
    </button>


    <a
        id="posaljiViberIzPoruke"
        class="posalji-viber-poruku"
        href="#"
    >
        📱 POŠALJI NA VIBER
    </a>


    <button
        type="button"
        class="zatvori-poruku"
        onclick="zatvoriPorukuOdsustva()"
    >
        ✕ ZATVORI
    </button>

</div>

            </div>

        `;

        document.body.appendChild(overlay);

overlay.style.position = "fixed";
overlay.style.left = "0";
overlay.style.top = "0";
overlay.style.width = "100vw";
overlay.style.height = "100vh";
overlay.style.zIndex = "999999";

    }

}


/* OTVARA PROZOR SA PORUKOM */

function otvoriPorukuOdsustva(index){

    let podatak = porukeOdsustva[index];

    if(!podatak){
        return;
    }

    let prozor = window.open("", "_blank");

    if(!prozor){
        alert("Telefon ili browser je blokirao otvaranje novog prozora.");
        return;
    }

    let porukaSigurna = podatak.poruka
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    let viberDugme = "";

    if(podatak.viberLink){

        viberDugme = `
            <a
                href="${podatak.viberLink}"
                class="viber"
            >
                📱 POŠALJI NA VIBER
            </a>
        `;

function kopirajPorukuOdsustva(){

    let tekst =
        document.getElementById("tekstPorukeOdsustva");

    if(!tekst){
        return;
    }

    navigator.clipboard.writeText(tekst.value)
        .then(function(){

            let dugme =
                document.querySelector(
                    '[onclick="kopirajPorukuOdsustva()"]'
                );

            if(dugme){

                let stariTekst = dugme.innerHTML;

                dugme.innerHTML = "✅ KOPIRANO!";

                setTimeout(function(){

                    dugme.innerHTML = stariTekst;

                }, 1500);

            }

        })
        .catch(function(){

            /* Rezervna opcija ako clipboard nije dostupan */

            tekst.select();

            document.execCommand("copy");

            alert("Poruka je kopirana.");

        });

}

function formatirajDatum(datum){

    if(!datum) return "";

    let delovi = datum.split("-");

    return delovi[2] + "." +
           delovi[1] + "." +
           delovi[0] + ".";
}
